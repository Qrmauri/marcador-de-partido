{% extends "torneo/base.html" %}
{% block title %}Confirmar borrado{% endblock %}
{% block content %}
<h1>Confirmar borrado</h1>
<form method="post" class="card">
  {% csrf_token %}
  <p>¿Seguro que quieres eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
  <button class="btn peligro" type="submit">Sí, eliminar</button>
  <a class="btn sec" href="{% url url_cancelar %}">Cancelar</a>
</form>
{% endblock %}
